[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bugfix-agent-benchmark"
version = "0.1.0"
description = "Independent patch replay and regression benchmark for Bugfix Agents"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
datasets = ["datasets>=2.14"]

[project.scripts]
bugfix-benchmark = "bugfix_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
