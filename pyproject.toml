[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bugfix-agent-benchmark"
version = "0.1.0"
description = "SWE-bench Lite evaluation runner for Bugfix Agents"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
datasets = ["datasets>=2.14"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
